---
# These tasks perform fixes used on the ICPC image to the base system.

- name: Add NTP servers
  lineinfile:
    dest: /etc/systemd/timesyncd.conf
    regexp: '^#?NTP='
    line: "NTP=ntp1 ntp2"
  notify: Restart systemd timesyncd
  when: WF_RESTRICTED_NETWORK

- name: Re-order PXEboot
  command: efibootmgr -o {{ EFI_ORDER }}
  when: EFI_ORDER is defined

# The VS Code extension gallery container binds 127.0.0.5:443, which blocks nginx.
- name: Check for VS Code gallery service
  stat:
    path: /etc/systemd/system/container-vscgallery.service
  register: vscgallery_service

- name: Disable VS Code gallery service
  systemd:
    name: container-vscgallery
    state: stopped
    enabled: false
  when: vscgallery_service.stat.exists

# The contestant image runs a filtering Squid proxy on localhost:3128 and points
# /etc/environment at it, which blocks git/composer/etc. under become_user.
- name: Check for contestant Squid service
  stat:
    path: /lib/systemd/system/squid.service
  register: squid_service

- name: Disable contestant Squid service
  systemd:
    name: squid
    state: stopped
    enabled: false
  when: squid_service.stat.exists

- name: Remove contestant Squid proxy from /etc/environment
  lineinfile:
    dest: /etc/environment
    regexp: '(?i)^((http|https|ftp)_proxy="http://localhost:3128/"|no_proxy="localhost,127\.0\.0\.1")$'
    state: absent
  when: squid_service.stat.exists

# The image sets OVERRIDE="" in .pam_environment to bypass Squid for root/icpcadmin;
# once /etc/environment no longer defines those vars, pam_env aborts login on them.
- name: Remove contestant proxy overrides from .pam_environment
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /root/.pam_environment
    - /home/icpcadmin/.pam_environment
  when: squid_service.stat.exists

- name: Check if nginx is installed
  stat:
    path: /usr/sbin/nginx
    get_attributes: false
    get_checksum: false
    get_mime: false
  register: nginx_binary
  check_mode: no

# Only needed before the installation, to keep its default site (with an IPv6
# listener) from being enabled. Afterwards the domserver role removes the file
# again, so creating it on every run would make the two roles undo each other.
- name: IPv6 nginx fixes
  when: not nginx_binary.stat.exists
  block:
    - name: Create nginx directory before installation
      file:
        path: /etc/{{ item }}
        state: directory
        mode: '0755'
        group: root
        owner: root
      loop:
        - nginx
        - nginx/sites-enabled

    - name: Create nginx default without IPv6 listener
      copy:
        dest: /etc/nginx/sites-enabled/default
        mode: '0644'
        group: root
        owner: root
        content: ""
